<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>tspa</title>
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
<script>try{var t=localStorage.getItem("tspa.theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header id="top">
  <span class="brand">tspa</span>
  <nav id="tabs">
    <a href="#/home" data-v="home"><b>1</b>home</a>
    <a href="#/notes" data-v="notes"><b>2</b>notes</a>
    <a href="#/tasks" data-v="tasks"><b>3</b>tasks</a>
    <a href="#/inbox" data-v="inbox"><b>4</b>inbox<i id="inbox-count"></i></a>
    <a href="#/services" data-v="services"><b>5</b>services</a>
  </nav>
  <span class="spacer"></span>
  <button id="overdue" class="chip bad" hidden></button>
  <button id="down" class="chip bad" hidden></button>
  <span id="clock" class="dim"></span>
  <button id="searchbtn" class="chip" title="search (/)">search <kbd>/</kbd></button>
  <button id="capbtn" class="chip on" title="capture (Space)">capture <kbd>Space</kbd></button>
  <button id="notifybtn" class="chip" title="notifications">🔕</button>
  <button id="helpbtn" class="chip" title="help (?)">?</button>
</header>
<div id="view"></div>
<footer id="hints"></footer>
<button id="fab" title="capture" aria-label="capture">+</button>
<div id="toasts"></div>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
