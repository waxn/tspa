<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>tspa · log in</title>
<meta name="theme-color" content="#0b0f14">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#0b0f14;--fg:#d8dee9;--dim:#7d8896;--line:#2a3340;--accent:#5ee1a0;--red:#ff6b6b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.4 ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
form{width:min(22rem,90vw);border:1px solid var(--line);border-radius:10px;padding:1.4rem}
h1{margin:0 0 1rem;font-size:1.1rem;letter-spacing:.12em;color:var(--accent)}
input,button{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:6px;padding:.55rem .7rem}
input:focus,button:focus{outline:none;border-color:var(--accent)}
button{margin-top:.6rem;cursor:pointer;color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:700}
.err{color:var(--red);margin:.6rem 0 0;font-size:.9rem}
</style></head>
<body><form method="post" action="/login"><h1>tspa</h1>
<input type="password" name="password" autofocus placeholder="password" autocomplete="current-password" aria-label="password">
<button>log in</button><div class="err" id="e" hidden>wrong password</div></form>
<script>if(location.search.includes("error"))document.getElementById("e").hidden=false</script></body></html>
