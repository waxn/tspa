[project]
name = "tspa"
version = "0.1.0"
description = "btop-style productivity app: todos, notes, stream, projects, smart quick-add"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "pwdlib[argon2]>=0.2",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10,<4",
    "dateparser>=1.2",
    "pywebpush>=2.0",
    "openai>=1.40",
    "tzdata",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.47"]

[tool.pytest.ini_options]
testpaths = ["tests"]
